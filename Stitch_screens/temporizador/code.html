<!DOCTYPE html><html class="dark" lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>PulseAI - Focus</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&amp;family=Inter:wght@400;600&amp;family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<style>
        @keyframes breathing {
            0%, 100% { transform: scale(1); opacity: 0.8; filter: blur(20px); }
            50% { transform: scale(1.1); opacity: 1; filter: blur(30px); }
        }
        .breathing-aura {
            animation: breathing 8s ease-in-out infinite;
        }
        .timer-glow {
            box-shadow: 0 0 40px -10px rgba(68, 226, 205, 0.3);
        }
        @keyframes fluid-bg {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        .animate-fluid {
            background: linear-gradient(-45deg, #13121b, #1b1b24, #13121b, #0e0d16);
            background-size: 400% 400%;
            animation: fluid-bg 15s ease infinite;
        }
        .glass-panel {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
    </style>

        darkMode: "class",
        theme: {

            "colors": {
                    "background": "#13121b",
                    "inverse-surface": "#e4e1ee",
                    "secondary": "#44e2cd",
                    "on-primary-fixed": "#0f0069",
                    "primary": "#c3c0ff",
                    "inverse-on-surface": "#302f39",
                    "surface-container-lowest": "#0e0d16",
                    "on-error": "#690005",
                    "on-tertiary-fixed": "#351000",
                    "surface-dim": "#13121b",
                    "on-secondary-container": "#004d44",
                    "surface-variant": "#35343e",
                    "tertiary-container": "#a44100",
                    "surface-bright": "#393842",
                    "on-secondary-fixed": "#00201c",
                    "primary-container": "#4f46e5",
                    "inverse-primary": "#4d44e3",
                    "surface": "#13121b",
                    "surface-container-highest": "#35343e",
                    "secondary-fixed-dim": "#3cddc7",
                    "outline-variant": "#464555",
                    "primary-fixed": "#e2dfff",
                    "on-primary-container": "#dad7ff",
                    "on-tertiary-container": "#ffd2be",
                    "secondary-container": "#03c6b2",
                    "primary-fixed-dim": "#c3c0ff",
                    "secondary-fixed": "#62fae3",
                    "surface-tint": "#c3c0ff",
                    "on-tertiary": "#571f00",
                    "on-secondary-fixed-variant": "#005047",
                    "surface-container-low": "#1b1b24",
                    "on-secondary": "#003731",
                    "error": "#ffb4ab",
                    "tertiary-fixed-dim": "#ffb695",
                    "on-error-container": "#ffdad6",
                    "on-background": "#e4e1ee",
                    "tertiary": "#ffb695",
                    "surface-container-high": "#2a2933",
                    "surface-container": "#1f1f28",
                    "tertiary-fixed": "#ffdbcc",
                    "on-primary-fixed-variant": "#3323cc",
                    "on-surface": "#e4e1ee",
                    "on-primary": "#1d00a5",
                    "error-container": "#93000a",
                    "on-tertiary-fixed-variant": "#7b2f00",
                    "on-surface-variant": "#c7c4d8",
                    "outline": "#918fa1"
            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "0.75rem",
                    "full": "9999px"
            },
            "spacing": {
                    "container-padding": "24px",
                    "base": "8px",
                    "gutter": "16px",
                    "card-gap": "20px"
            },
            "fontFamily": {
                    "headline-lg": ["Plus Jakarta Sans"],
                    "label-caps": ["Inter"],
                    "display-timer": ["Plus Jakarta Sans"],
                    "headline-lg-mobile": ["Plus Jakarta Sans"],
                    "body-md": ["Inter"]
            },
            "fontSize": {
                    "headline-lg": ["32px", {"lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "600"}],
                    "label-caps": ["12px", {"lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "600"}],
                    "display-timer": ["80px", {"lineHeight": "80px", "letterSpacing": "-0.04em", "fontWeight": "700"}],
                    "headline-lg-mobile": ["24px", {"lineHeight": "32px", "fontWeight": "600"}],
                    "body-md": ["16px", {"lineHeight": "24px", "fontWeight": "400"}]
            }
          },
        },
      }

</head>
<body class="bg-background text-on-background font-body-md overflow-hidden animate-fluid min-h-screen">
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 flex justify-between items-center px-container-padding h-16 w-full bg-background/80 backdrop-blur-xl border-b border-white/10">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-primary" data-icon="bubble_chart">bubble_chart</span>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile font-bold bg-gradient-to-r from-primary to-secondary bg-clip-text text-transparent">PomodoroAI</h1>
</div>
<div class="w-8 h-8 rounded-full bg-surface-container-highest flex items-center justify-center overflow-hidden border border-white/10 hover:opacity-80 transition-opacity cursor-pointer">
<img alt="User Profile" class="w-full h-full object-cover" data-alt="A professional headshot avatar of a young creative professional with a friendly expression. The avatar is styled in a modern, clean, vector-based design that matches a high-tech app interface. The lighting is soft and neutral, and the color palette includes subtle lavender and teal accents to align with the core brand colors." src="https://lh3.googleusercontent.com/aida-public/AB6AXuBTitnnQL8AghhWnxz4RAcfyRZLm7f9HqsBmiiz0T5oqywuciMK5FJwnNa3-QCcbjGc8XNSNtjGkm5u0yqWo9uUHuPWAtTDbPMXSMecBtOyZx--09p54bE5AEAPoVuw8CVhBC5BiBHn2x8eLiIPDMHJcWIrAJW32Mi8LopY7qPYHOQ5PGI8NTu99HpbY5lOah2GZXCD-avbe462pO_KDW1wVMQ_Sy4WZXPGzR3c9UzcOE9Q8I1guwQCuNk1JzO7UjmroQAS8DqZgBU">
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex flex-col items-center justify-center min-h-screen pt-16 pb-24 px-container-padding relative">
<!-- Breathing Background Aura (AI Presence) -->
<div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-96 h-96 bg-secondary/10 rounded-full breathing-aura -z-10"></div>
<div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-80 h-80 bg-primary/5 rounded-full breathing-aura -z-10" style="animation-delay: -2s;"></div>
<!-- Timer Circle Container -->
<div class="relative flex items-center justify-center w-72 h-72 md:w-96 md:h-96">
<!-- SVG Progress Ring -->
<svg class="absolute inset-0 w-full h-full -rotate-90">
<circle class="text-white/5" cx="50%" cy="50%" fill="transparent" r="48%" stroke="currentColor" stroke-width="4"></circle>
<circle class="text-secondary timer-glow transition-all duration-1000" cx="50%" cy="50%" fill="transparent" r="48%" stroke="currentColor" stroke-dasharray="1000" stroke-dashoffset="300" stroke-linecap="round" stroke-width="4"></circle>
</svg>
<!-- Time Display -->
<div class="text-center z-10">
<p class="font-label-caps text-label-caps text-secondary uppercase tracking-widest mb-2">Deep Work</p>
<span class="font-display-timer text-display-timer text-on-surface select-none">32:00</span>
</div>
</div>
<!-- AI Adjustment Badge -->
<div class="mt-12 flex items-center gap-2 px-4 py-2 rounded-full glass-panel border border-secondary/20 active:scale-95 transition-transform cursor-default">
<span class="material-symbols-outlined text-secondary text-sm" data-icon="auto_awesome">auto_awesome</span>
<span class="font-label-caps text-label-caps text-on-surface">Ajustado por IA: +7m basado en tu energía alta</span>
</div>
<!-- Controls -->
<div class="mt-12 flex items-center gap-gutter">
<!-- Stop -->
<button class="w-14 h-14 rounded-full flex items-center justify-center glass-panel text-on-surface-variant hover:text-error hover:border-error/30 transition-all active:scale-90">
<span class="material-symbols-outlined" data-icon="stop">stop</span>
</button>
<!-- Pause / Play -->
<button class="w-20 h-20 rounded-full flex items-center justify-center bg-gradient-to-br from-primary to-secondary text-on-primary-fixed shadow-lg shadow-secondary/20 hover:opacity-90 transition-all active:scale-90">
<span class="material-symbols-outlined text-4xl" data-icon="pause" style="font-variation-settings: 'FILL' 1;">pause</span>
</button>
<!-- Skip -->
<button class="w-14 h-14 rounded-full flex items-center justify-center glass-panel text-on-surface-variant hover:text-primary hover:border-primary/30 transition-all active:scale-90">
<span class="material-symbols-outlined" data-icon="skip_next">skip_next</span>
</button>
</div>
<!-- Goal Progress -->
<div class="mt-16 w-full max-w-xs space-y-3">
<div class="flex justify-between items-end px-1">
<span class="font-label-caps text-label-caps text-on-surface-variant">Daily Goal</span>
<span class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface">3<span class="text-on-surface-variant/50">/8</span></span>
</div>
<div class="h-1.5 w-full bg-surface-container-highest rounded-full overflow-hidden">
<div class="h-full bg-secondary w-[37.5%] rounded-full shadow-[0_0_10px_rgba(68,226,205,0.4)]"></div>
</div>
</div>
</main>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-4 pb-6 pt-3 bg-background/80 backdrop-blur-xl border-t border-white/10 rounded-t-xl shadow-lg">
<button class="flex flex-col items-center justify-center text-secondary bg-secondary/10 rounded-xl px-4 py-1 Active: scale-90 transition-transform duration-200">
<span class="material-symbols-outlined" data-icon="timer" style="font-variation-settings: 'FILL' 1;">timer</span>
<span class="font-label-caps text-label-caps mt-1">Focus</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant opacity-60 hover:text-secondary transition-colors duration-200">
<span class="material-symbols-outlined" data-icon="history">history</span>
<span class="font-label-caps text-label-caps mt-1">History</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant opacity-60 hover:text-secondary transition-colors duration-200">
<span class="material-symbols-outlined" data-icon="person">person</span>
<span class="font-label-caps text-label-caps mt-1">Profile</span>
</button>
</nav>
<script>
        // Simple Interaction logic
        const playBtn = document.querySelector('button .material-symbols-outlined[data-icon="pause"]');
        let isPaused = false;

        playBtn.parentElement.addEventListener('click', () => {
            isPaused = !isPaused;
            playBtn.innerText = isPaused ? 'play_arrow' : 'pause';
            playBtn.setAttribute('data-icon', isPaused ? 'play_arrow' : 'pause');
            
            // Visual feedback on the breathing aura
            const auras = document.querySelectorAll('.breathing-aura');
            auras.forEach(aura => {
                aura.style.animationPlayState = isPaused ? 'paused' : 'running';
                aura.style.opacity = isPaused ? '0.3' : '1';
            });
        });

        // Simulated timer countdown micro-animation (Visual only)
        let seconds = 32 * 60;
        const timerDisplay = document.querySelector('.text-display-timer');
        const progressRing = document.querySelector('circle.text-secondary');
        const totalLength = 1000;

        setInterval(() => {
            if (!isPaused && seconds > 0) {
                seconds--;
                const mins = Math.floor(seconds / 60);
                const secs = seconds % 60;
                timerDisplay.innerText = `${mins}:${secs.toString().padStart(2, '0')}`;
                
                // Update ring dashoffset
                const percentage = seconds / (32 * 60);
                progressRing.style.strokeDashoffset = totalLength * (1 - percentage);
            }
        }, 1000);
    </script>


</body></html>
